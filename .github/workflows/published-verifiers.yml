name: Published verifier qualification
on:
  push:
    branches: ['main', 'rc/oct3-published-monitor']
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * *'
permissions:
  contents: read
jobs:
  qualification:
    name: published verifier qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare bounded registry archives without executing verifiers
        run: node scripts/prepare-published-verifiers.mjs "$RUNNER_TEMP/published-subject"
      - name: Prepare disposable image
        run: docker build --tag aga-published-verifiers "$RUNNER_TEMP/published-subject"
      - name: Qualify published bytes offline without credentials
        env:
          QUALIFIED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published-evidence"
          chmod 777 "$RUNNER_TEMP/published-evidence"
          timeout --signal=TERM --kill-after=10s 300s docker run --name aga-published-qualification --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 --user node --tmpfs /tmp:rw,nosuid,nodev,size=64m -e AGA_DISPOSABLE_CHECK=1 -e QUALIFIED_COMMIT -v "$RUNNER_TEMP/published-evidence:/evidence:rw" aga-published-verifiers
      - name: Retain container boundary evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/published-evidence"
          docker inspect aga-published-qualification > "$RUNNER_TEMP/published-evidence/container.json"
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync(process.argv[1]))[0]; const h=c.HostConfig; const b={network:h.NetworkMode,readOnly:h.ReadonlyRootfs,capDrop:h.CapDrop,securityOpt:h.SecurityOpt,memory:h.Memory,nanoCpus:h.NanoCpus,pids:h.PidsLimit,user:c.Config.User,exitCode:c.State.ExitCode,oomKilled:c.State.OOMKilled,mounts:c.Mounts.map(m=>({destination:m.Destination,rw:m.RW})),tmpfs:h.Tmpfs}; console.log("AGA_PUBLISHED_CONTAINER_BOUNDARY="+Buffer.from(JSON.stringify(b)).toString("base64"));' "$RUNNER_TEMP/published-evidence/container.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-verifier-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/published-evidence
          retention-days: 30
