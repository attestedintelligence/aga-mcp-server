name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Dependency CVE audit — prod deps only (gate on high+)
        # Fails the build on a high/critical CVE in a PRODUCTION dependency. Dev-only deps are
        # excluded (--omit=dev): they never ship in the published tarball. The audit is
        # lockfile-deterministic, so run it once (node 20 leg) rather than redundantly per matrix entry.
        if: matrix.node-version == 20
        run: npm audit --omit=dev --audit-level=high
      - name: OSV-Scanner lockfile CVE scan (non-blocking)
        # Cross-ecosystem OSV-database coverage over the lockfile, for visibility. Non-blocking
        # (continue-on-error) so an OSV advisory — or a scanner/download hiccup — never fails CI;
        # the npm audit step above is the enforcing gate. Pinned binary, no third-party action needed.
        if: matrix.node-version == 20
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" -r .

  independent-verifier:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: cd independent-verifier && npm ci && npm test

  spec-vendor-freeze:
    # CA-05: the vendored aga-receipt-spec/ tree is release-frozen. Any edit to it that does not
    # come through scripts/sync-spec-vendor.mjs (which rewrites the manifest in the same commit)
    # fails here — a spec rule change can never be hand-copied inconsistently again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-spec-vendor.mjs

  verify-zero-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent verifier has zero AGA imports
        run: |
          # verify.ts is the single source file; scan it only. (Passing a nonexistent path like the
          # old independent-verifier/src/ makes grep exit 2 on the path error, so the `if grep` FAIL
          # branch never runs and the guard silently passes. Anchoring on the real file fixes that.)
          if grep -nE "(from|require\()[[:space:]]*['\"](\.\.?/(src|dist)|@attested-intelligence/aga-mcp-server)" independent-verifier/verify.ts; then
            echo "FAIL: independent verifier imports AGA source or the aga-mcp-server package"
            exit 1
          fi
          echo "PASS: zero AGA imports confirmed"
      - name: Verify independent verifier has zero third-party runtime deps
        run: |
          node -e "const d=require('./independent-verifier/package.json').dependencies||{}; if(Object.keys(d).length){console.error('FAIL: runtime deps present:',Object.keys(d));process.exit(1)} console.log('PASS: zero runtime dependencies')"
