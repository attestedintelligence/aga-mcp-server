name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  independent-verifier:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: cd independent-verifier && npm ci && npm test

  verify-zero-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent verifier has zero AGA imports
        run: |
          # verify.ts is the single source file; scan it only. (Passing a nonexistent path like the
          # old independent-verifier/src/ makes grep exit 2 on the path error, so the `if grep` FAIL
          # branch never runs and the guard silently passes. Anchoring on the real file fixes that.)
          if grep -nE "(from|require\()[[:space:]]*['\"](\.\.?/(src|dist)|@attested-intelligence/aga-mcp-server)" independent-verifier/verify.ts; then
            echo "FAIL: independent verifier imports AGA source or the aga-mcp-server package"
            exit 1
          fi
          echo "PASS: zero AGA imports confirmed"
      - name: Verify independent verifier has zero third-party runtime deps
        run: |
          node -e "const d=require('./independent-verifier/package.json').dependencies||{}; if(Object.keys(d).length){console.error('FAIL: runtime deps present:',Object.keys(d));process.exit(1)} console.log('PASS: zero runtime dependencies')"
