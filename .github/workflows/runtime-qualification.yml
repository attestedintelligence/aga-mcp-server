name: Isolated runtime qualification
on:
  push:
    branches: ['rc/sol61-runtime-hardening-20260930']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare tracked source and pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/subject" "$RUNNER_TEMP/evidence"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/subject"
          cd "$RUNNER_TEMP/subject"
          find . -name '.env*' -type f -delete
          npm ci --no-audit --no-fund
          node node_modules/typescript/bin/tsc
          mkdir -p node_modules/.vite-temp
          chmod 777 "$RUNNER_TEMP/evidence"
      - name: Run credential-free bounded container
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:${{ matrix.node }}-bookworm-slim
          image=$(docker image inspect node:${{ matrix.node }}-bookworm-slim --format '{{.Id}}')
          docker image inspect "$image" > "$RUNNER_TEMP/evidence/image.json"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/evidence/commit.txt"
          timeout --signal=TERM --kill-after=15s 600s docker run --name runtime-qualification --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 1536m --cpus 2 --user node --tmpfs /tmp:rw,nosuid,nodev,size=384m --tmpfs /subject/node_modules/.vite-temp:rw,nosuid,nodev,size=16m,uid=1000,gid=1000 -e NODE_OPTIONS=--max-old-space-size=768 -e CI=true -v "$RUNNER_TEMP/subject:/subject:ro" -v "$RUNNER_TEMP/evidence:/evidence:rw" -w /subject "$image" bash scripts/runtime-qualification.sh 2>&1 | tee "$RUNNER_TEMP/evidence/qualification.log"
      - name: Record outcome
        if: always()
        shell: bash
        run: |
          docker inspect runtime-qualification > "$RUNNER_TEMP/evidence/container.json" || true
          docker rm -f runtime-qualification || true
          cd "$RUNNER_TEMP/evidence"
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-qualification-node${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
