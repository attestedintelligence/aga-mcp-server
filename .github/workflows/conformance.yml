name: conformance
# Full release gate: clean build + type-check + tests + SEP conformance (driven by the
# normative reference verifier) + the pack-manifest guard (no forgeable/stale artifacts
# can be published). `npm run check` = build && lint && test && test:conformance && check:pack.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - name: build + lint + tests + SEP conformance + pack guard
        run: npm run check
