name: release
# Provenance publish workflow for @attested-intelligence/aga-mcp-server (PUBLIC repo).
#
# Manual only (workflow_dispatch). Builds from the checked-out ref, runs the FULL gate
# (`npm run check`) AND the 6-verifier cross-stack conformance harness as REQUIRED pre-publish
# gates, then publishes with npm provenance under a dist-tag (default `rc`, `latest` only for a
# vetted final). This repo is PUBLIC, so npm provenance is supported and is REQUIRED for `latest`.
#
# Auth: npm OIDC TRUSTED PUBLISHING (no stored token). Configure the package's trusted publisher on
# npmjs.com to this repo (attestedintelligence/aga-mcp-server) + this workflow (release.yml); the job
# requests `id-token: write`. The reference verifier is vendored in-repo (aga-receipt-spec/verify),
# so there is no submodule/token to manage.
#
# Action `uses:` SHAs verified against upstream release tags 2026-06-07.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (rc for the soak; latest only for a vetted release)'
        type: string
        default: 'rc'
      provenance:
        description: 'Publish with npm provenance (REQUIRED for latest)'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run: build + full gate + cross-stack + pack guard, but DO NOT publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # npm OIDC trusted publishing + provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for OIDC trusted publishing
        # node 20 ships npm 10, which cannot authenticate the registry publish via OIDC trusted
        # publishing (needs npm >= 11.5.1). Upgrade so the publish authenticates.
        run: npm install -g npm@latest
      - name: Setup Go (cross-stack harness)
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          # >= the v2 oracle module's go directive (aga-receipt-spec/verify/v2/go.mod) so CIRCL builds;
          # the zero-dep v1 verify.go builds on any toolchain.
          go-version: '1.26'
      - name: Setup Python (cross-stack harness)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: npm ci
      - name: Install audited Ed25519 for the default Python verifier
        run: python -m pip install --upgrade cryptography
      - name: Required gate — build + lint + tests + SEP conformance + pack guard
        run: npm run check
      - name: Build the published verifier (aga-verify) for the cross-stack harness
        working-directory: independent-verifier
        run: |
          npm ci
          node build.mjs
      - name: Required gate — cross-stack conformance (all 6 verifiers agree)
        run: npm run conformance:cross-stack
      - name: Required gate — v2 cross-stack conformance (noble/JS ≡ CIRCL/Go on the pinned v2 corpus)
        # Locks the v2 (ML-DSA-65+Ed25519 composite) profile: two independent-language oracles must agree
        # on every pinned v2 corpus case, and the v1-only verifiers must emit UNSUPPORTED_PROFILE on v2.
        # The Go oracle (aga-receipt-spec/verify/v2) fetches CIRCL via the default proxy and verifies it
        # against the committed go.sum. A gapped/divergent v2 verifier cannot be published.
        run: npm run conformance:cross-stack-v2
      - name: Publish (or dry run)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          PROVENANCE: ${{ inputs.provenance }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DIST_TAG" = "latest" ] && [ "$PROVENANCE" != "true" ]; then
            echo "::error::provenance is REQUIRED for a latest publish (this repo is public)"; exit 1
          fi
          PROV_FLAG=""
          [ "$PROVENANCE" = "true" ] && PROV_FLAG="--provenance"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — would publish: npm publish --access public --tag $DIST_TAG $PROV_FLAG"
            npm pack --dry-run
          else
            npm publish --access public --tag "$DIST_TAG" $PROV_FLAG
          fi
