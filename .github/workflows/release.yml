name: release
# Provenance publish workflow for @attested-intelligence/aga-mcp-server (PUBLIC repo).
#
# Manual only (workflow_dispatch). Builds from the checked-out ref, runs the FULL gate
# (`npm run check`) AND the 6-verifier cross-stack conformance harness as REQUIRED pre-publish
# gates, then publishes with npm provenance under a dist-tag (default `rc`, `latest` only for a
# vetted final). This repo is PUBLIC, so npm provenance is supported and is REQUIRED for `latest`.
#
# Auth: npm OIDC TRUSTED PUBLISHING (no stored token). Configure the package's trusted publisher on
# npmjs.com to this repo (attestedintelligence/aga-mcp-server) + this workflow (release.yml); the job
# requests `id-token: write`. The reference verifier is vendored in-repo (aga-receipt-spec/verify),
# so there is no submodule/token to manage.
#
# Action `uses:` SHAs verified against upstream release tags 2026-06-07.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (rc for the soak; latest only for a vetted release)'
        type: string
        default: 'rc'
      provenance:
        description: 'Publish with npm provenance (REQUIRED for latest)'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run: build + full gate + cross-stack + pack guard, but DO NOT publish'
        type: boolean
        default: true
      promote_only:
        description: 'CANNOT RUN IN CI — the job prints the exact local command and exits 1. OIDC trusted publishing scopes its credential to npm publish, and a dist-tag move is not a publish (E401). Move an rc to latest from a machine with npm login.'
        type: boolean
        default: false
      publish_server:
        description: 'Publish @attested-intelligence/aga-mcp-server'
        type: boolean
        default: true
      publish_verifier:
        description: 'Also publish @attested-intelligence/aga-verify from independent-verifier/ (needs its own npm trusted-publisher config pointing at this repo + release.yml)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # npm OIDC trusted publishing + provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for OIDC trusted publishing
        # node 20 ships npm 10, which cannot authenticate the registry publish via OIDC trusted
        # publishing (needs npm >= 11.5.1). npm 12 dropped node 20 (EBADENGINE), so pin the
        # npm 11 line — OIDC-capable and compatible with the node pin above.
        run: npm install -g npm@11
      - name: Setup Go (cross-stack harness)
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          # >= the v2 oracle module's go directive (aga-receipt-spec/verify/v2/go.mod) so CIRCL builds;
          # the zero-dep v1 verify.go builds on any toolchain.
          go-version: '1.26'
      - name: Setup Python (cross-stack harness)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: npm ci
      - name: Required gate — dependency CVE audit (prod deps only, high+)
        # BLOCKS the release before publish on a high/critical CVE in a PRODUCTION dependency.
        # Dev-only deps are excluded (--omit=dev): they are never present in the published tarball.
        run: npm audit --omit=dev --audit-level=high
      - name: Install audited Ed25519 for the default Python verifier
        run: python -m pip install --upgrade cryptography
      - name: Required gate — build + lint + tests + SEP conformance + pack guard
        run: npm run check
      - name: Build the published verifier (aga-verify) for the cross-stack harness
        working-directory: independent-verifier
        run: |
          npm ci
          node build.mjs
      - name: Required gate — cross-stack conformance (all 6 verifiers agree)
        run: npm run conformance:cross-stack
      - name: Required gate — v2 cross-stack conformance (noble/JS ≡ CIRCL/Go on the pinned v2 corpus)
        # Locks the v2 (ML-DSA-65+Ed25519 composite) profile: two independent-language oracles must agree
        # on every pinned v2 corpus case, and the v1-only verifiers must emit UNSUPPORTED_PROFILE on v2.
        # The Go oracle (aga-receipt-spec/verify/v2) fetches CIRCL via the default proxy and verifies it
        # against the committed go.sum. A gapped/divergent v2 verifier cannot be published.
        run: npm run conformance:cross-stack-v2
      - name: Publish aga-mcp-server (or dry run)
        if: ${{ inputs.publish_server }}
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          PROVENANCE: ${{ inputs.provenance }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE_ONLY: ${{ inputs.promote_only }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # PROMOTE path. npm refuses to publish a version that already exists
          # (EPUBLISHCONFLICT), so the rc -> latest move is a TAG operation, not a publish. This
          # existed as a real gap: the 3.5.0 latest run failed here because the rc run had already
          # published that exact version. Provenance is unaffected — the attestation is bound to the
          # published tarball, and moving a dist-tag only repoints a pointer at it.
          # PROMOTION CANNOT RUN HERE, and pretending it could cost a release.
          # This job authenticates with npm OIDC trusted publishing, which mints a
          # short-lived credential scoped to 'npm publish'. A dist-tag move is a
          # different registry write, so npm falls back to the .npmrc that setup-node
          # wrote -- the empty placeholder that exists because this repo deliberately
          # stores no NPM_TOKEN -- and the registry answers E401. Proven on run
          # 35556989791 (2026-09-21) and on every promote attempt before it.
          # So: print the exact command that does work, and fail honestly.
          if [ "$PROMOTE_ONLY" = "true" ]; then
            echo "promote_only: moving a dist-tag is not a publish, and this job cannot authenticate it."
            echo ""
            echo "Run this from a machine that has done 'npm login':"
            echo ""
            echo "  npm dist-tag add @attested-intelligence/aga-mcp-server@$VERSION $DIST_TAG"
            echo ""
            echo "Provenance is unaffected. The attestation is bound to the published tarball;"
            echo "a dist-tag only repoints a pointer at it."
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN -- reporting only, no failure."
              exit 0
            fi
            echo "::error::promote_only cannot run in CI under OIDC (E401). Run the 'npm dist-tag add' line printed above, locally."
            exit 1
          fi
          if [ "$DIST_TAG" = "latest" ] && [ "$PROVENANCE" != "true" ]; then
            echo "::error::provenance is REQUIRED for a latest publish (this repo is public)"; exit 1
          fi
          PROV_FLAG=""
          [ "$PROVENANCE" = "true" ] && PROV_FLAG="--provenance"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — would publish: npm publish --access public --tag $DIST_TAG $PROV_FLAG"
            npm pack --dry-run
          else
            npm publish --access public --tag "$DIST_TAG" $PROV_FLAG
          fi
      - name: Post-publish gate — npm attestation MUST be present (aga-mcp-server)
        # A provenance-less publish must fail this workflow loudly. 3.3.0 shipped without
        # dist.attestations; this gate makes that class of regression impossible to miss.
        if: ${{ inputs.publish_server && !inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PKG="@attested-intelligence/aga-mcp-server"
          ENC=$(printf '%s' "$PKG" | sed 's|/|%2F|')
          DOC=$(mktemp)
          # SIX MINUTES, not sixty seconds, and read the REGISTRY rather than `npm view`.
          #
          # Budget: npm publishes asynchronously. The CLI answers "your package is being
          # processed and may take a few minutes to become available" and the version is
          # unreadable until that finishes. On the 3.6.0 release the publish returned at
          # 03:12:01 and the version became readable at 03:14:23 -- 64 seconds after a
          # 6x10s budget had already given up. The job went red on a publish that had
          # completely succeeded, provenance and all. That is the worst thing a gate can
          # do: it teaches the operator to re-run, and a second publish of the same
          # version is EPUBLISHCONFLICT.
          #
          # Source: `npm view` answers from npm's local metadata cache, so it can report a
          # 404 for a version that is already live. The version document on the registry
          # has no cache in front of it and is a clean 200-or-404, which is exactly the
          # question being asked.
          #
          # Three outcomes, three messages. "Published without provenance" is NOT a
          # waiting problem -- attestations are attached at publish time, so if the
          # document exists and lacks them, retrying cannot help and the gate says so
          # immediately instead of burning six minutes.
          for i in $(seq 1 36); do
            if curl -fsSL "https://registry.npmjs.org/$ENC/$VERSION" -o "$DOC" 2>/dev/null; then
              if node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.exit(j.dist&&j.dist.attestations?0:1)" "$DOC"; then
                PUBLISHED=$(curl -fsSL "https://registry.npmjs.org/$ENC" 2>/dev/null \
                  | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).time['$VERSION']||'unknown'}catch(e){'unknown'}" 2>/dev/null || echo unknown)
                ATT=$(node -pe "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).dist.attestations.url" "$DOC" 2>/dev/null || echo unknown)
                echo "OK: $PKG@$VERSION carries dist.attestations"
                echo "    readable after ~$((i * 10))s; registry publish time $PUBLISHED"
                echo "    attestations: $ATT"
                exit 0
              fi
              echo "::error::$PKG@$VERSION IS PUBLISHED but carries no dist.attestations. The tarball went out without provenance, and provenance cannot be added after the fact. Do NOT move a dist-tag onto it: publish a patch version with --provenance instead."
              exit 1
            fi
            echo "attempt $i/36: $PKG@$VERSION not on the registry yet (npm publishes asynchronously); retrying in 10s"
            sleep 10
          done
          echo "::error::$PKG@$VERSION never became readable within 6 minutes. BEFORE RE-RUNNING, READ THE REGISTRY: curl https://registry.npmjs.org/$ENC/$VERSION -- if it returns 200 the publish SUCCEEDED and re-running will fail with EPUBLISHCONFLICT, so move the dist-tag locally instead; if it 404s the publish genuinely failed and a re-run is correct."
          exit 1
      - name: Publish aga-verify (or dry run)
        # Publishes the standalone verifier from independent-verifier/ with npm provenance via the
        # SAME OIDC trusted-publishing flow. npm trusted publishing is configured PER PACKAGE on
        # npmjs.com — @attested-intelligence/aga-verify must have a trusted publisher pointing at
        # attestedintelligence/aga-mcp-server + release.yml, or this step fails with an auth error.
        # Ordered AFTER the server publish + its attestation gate so a verifier-side auth failure
        # can never block an already-gated server release.
        if: ${{ inputs.publish_verifier }}
        working-directory: independent-verifier
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          PROVENANCE: ${{ inputs.provenance }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE_ONLY: ${{ inputs.promote_only }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # PROMOTE path — see the equivalent block in the server step for why a tag move is not a
          # publish. Kept symmetrical deliberately: the two packages release together, so a promote
          # that covered only one of them would leave `latest` split across versions.
          # PROMOTION CANNOT RUN HERE, and pretending it could cost a release.
          # This job authenticates with npm OIDC trusted publishing, which mints a
          # short-lived credential scoped to 'npm publish'. A dist-tag move is a
          # different registry write, so npm falls back to the .npmrc that setup-node
          # wrote -- the empty placeholder that exists because this repo deliberately
          # stores no NPM_TOKEN -- and the registry answers E401. Proven on run
          # 35556989791 (2026-09-21) and on every promote attempt before it.
          # So: print the exact command that does work, and fail honestly.
          if [ "$PROMOTE_ONLY" = "true" ]; then
            echo "promote_only: moving a dist-tag is not a publish, and this job cannot authenticate it."
            echo ""
            echo "Run this from a machine that has done 'npm login':"
            echo ""
            echo "  npm dist-tag add @attested-intelligence/aga-verify@$VERSION $DIST_TAG"
            echo ""
            echo "Provenance is unaffected. The attestation is bound to the published tarball;"
            echo "a dist-tag only repoints a pointer at it."
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN -- reporting only, no failure."
              exit 0
            fi
            echo "::error::promote_only cannot run in CI under OIDC (E401). Run the 'npm dist-tag add' line printed above, locally."
            exit 1
          fi
          if [ "$DIST_TAG" = "latest" ] && [ "$PROVENANCE" != "true" ]; then
            echo "::error::provenance is REQUIRED for a latest publish (this repo is public)"; exit 1
          fi
          PROV_FLAG=""
          [ "$PROVENANCE" = "true" ] && PROV_FLAG="--provenance"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — would publish: npm publish --access public --tag $DIST_TAG $PROV_FLAG"
            npm pack --dry-run
          else
            npm publish --access public --tag "$DIST_TAG" $PROV_FLAG
          fi
      - name: Post-publish gate — npm attestation MUST be present (aga-verify)
        if: ${{ inputs.publish_verifier && !inputs.dry_run }}
        working-directory: independent-verifier
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PKG="@attested-intelligence/aga-verify"
          ENC=$(printf '%s' "$PKG" | sed 's|/|%2F|')
          DOC=$(mktemp)
          # SIX MINUTES, not sixty seconds, and read the REGISTRY rather than `npm view`.
          #
          # Budget: npm publishes asynchronously. The CLI answers "your package is being
          # processed and may take a few minutes to become available" and the version is
          # unreadable until that finishes. On the 3.6.0 release the publish returned at
          # 03:12:01 and the version became readable at 03:14:23 -- 64 seconds after a
          # 6x10s budget had already given up. The job went red on a publish that had
          # completely succeeded, provenance and all. That is the worst thing a gate can
          # do: it teaches the operator to re-run, and a second publish of the same
          # version is EPUBLISHCONFLICT.
          #
          # Source: `npm view` answers from npm's local metadata cache, so it can report a
          # 404 for a version that is already live. The version document on the registry
          # has no cache in front of it and is a clean 200-or-404, which is exactly the
          # question being asked.
          #
          # Three outcomes, three messages. "Published without provenance" is NOT a
          # waiting problem -- attestations are attached at publish time, so if the
          # document exists and lacks them, retrying cannot help and the gate says so
          # immediately instead of burning six minutes.
          for i in $(seq 1 36); do
            if curl -fsSL "https://registry.npmjs.org/$ENC/$VERSION" -o "$DOC" 2>/dev/null; then
              if node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.exit(j.dist&&j.dist.attestations?0:1)" "$DOC"; then
                PUBLISHED=$(curl -fsSL "https://registry.npmjs.org/$ENC" 2>/dev/null \
                  | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).time['$VERSION']||'unknown'}catch(e){'unknown'}" 2>/dev/null || echo unknown)
                ATT=$(node -pe "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).dist.attestations.url" "$DOC" 2>/dev/null || echo unknown)
                echo "OK: $PKG@$VERSION carries dist.attestations"
                echo "    readable after ~$((i * 10))s; registry publish time $PUBLISHED"
                echo "    attestations: $ATT"
                exit 0
              fi
              echo "::error::$PKG@$VERSION IS PUBLISHED but carries no dist.attestations. The tarball went out without provenance, and provenance cannot be added after the fact. Do NOT move a dist-tag onto it: publish a patch version with --provenance instead."
              exit 1
            fi
            echo "attempt $i/36: $PKG@$VERSION not on the registry yet (npm publishes asynchronously); retrying in 10s"
            sleep 10
          done
          echo "::error::$PKG@$VERSION never became readable within 6 minutes. BEFORE RE-RUNNING, READ THE REGISTRY: curl https://registry.npmjs.org/$ENC/$VERSION -- if it returns 200 the publish SUCCEEDED and re-running will fail with EPUBLISHCONFLICT, so move the dist-tag locally instead; if it 404s the publish genuinely failed and a re-run is correct."
          exit 1
