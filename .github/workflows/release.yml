name: release
# Build/test has no OIDC permission. The publisher consumes only exact checked archives.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Registry tag for an approved release'
        type: choice
        options: [rc, latest]
        default: rc
      provenance:
        description: 'Required for every publication'
        type: boolean
        default: true
      dry_run:
        description: 'Qualify archives without registry writes'
        type: boolean
        default: true
      promote_only:
        description: 'Unsupported by OIDC publication; reject rather than republish'
        type: boolean
        default: false
      publish_server:
        type: boolean
        default: true
        description: 'Qualify/publish the runtime archive'
      publish_verifier:
        type: boolean
        default: false
        description: 'Qualify/publish the standalone verifier archive'
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      server_hash: ${{ steps.server.outputs.sha256 }}
      server_version: ${{ steps.server.outputs.version }}
      verifier_hash: ${{ steps.archives.outputs.verifier_hash }}
      verifier_version: ${{ steps.archives.outputs.verifier_version }}
    steps:
      - name: Validate release intent
        env:
          TAG: ${{ inputs.dist_tag }}
          PROMOTE: ${{ inputs.promote_only }}
          PROVENANCE: ${{ inputs.provenance }}
          SERVER: ${{ inputs.publish_server }}
          VERIFIER: ${{ inputs.publish_verifier }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = attestedintelligence/aga-mcp-server
          case "$GITHUB_REF" in refs/heads/main|refs/heads/rc/*) ;; *) echo 'Release requires main or a reviewed rc branch'; exit 1;; esac
          case "$TAG" in rc|latest) ;; *) exit 1;; esac
          test "$PROMOTE" = false || { echo 'A tag move is not publication. Use an authenticated registry tag operation.'; exit 1; }
          test "$PROVENANCE" = true
          test "$SERVER" = true || test "$VERIFIER" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '24'
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a
        with:
          go-version: '1.26'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: python -m pip install --upgrade cryptography
      - run: npm run check
      - run: node --test scripts/runtime-release-evidence.test.mjs
      - name: Build and test the independent verifier
        working-directory: independent-verifier
        run: |
          npm ci
          node build.mjs
          npm test
      - run: npm run conformance:cross-stack
      - run: npm run conformance:cross-stack-v2
      - name: Preserve historical documentation-release gate
        if: inputs.publish_server
        run: node scripts/check-docs-release.mjs
      - name: Bind every runtime version to isolated exact-archive qualification
        id: server
        if: inputs.publish_server
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-runtime-release.mjs
      - name: Stage only qualified archives
        id: archives
        env:
          SERVER: ${{ inputs.publish_server }}
          VERIFIER: ${{ inputs.publish_verifier }}
          QUALIFIED_TARBALL: ${{ steps.server.outputs.qualified_tarball }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish"
          if [ "$SERVER" = true ]; then
            test -f "$QUALIFIED_TARBALL"
            cp "$QUALIFIED_TARBALL" "$RUNNER_TEMP/publish/server.tgz"
          fi
          if [ "$VERIFIER" = true ]; then
            cd independent-verifier
            archive=$(npm pack --ignore-scripts --silent)
            mkdir "$RUNNER_TEMP/verifier-consumer"
            tar -xzf "$archive" -C "$RUNNER_TEMP/verifier-consumer"
            version=$(node -p "require('./package.json').version")
            key=$(node -p "require('./example-bundle.json').public_key")
            node "$RUNNER_TEMP/verifier-consumer/package/dist/aga-verify.mjs" "$RUNNER_TEMP/verifier-consumer/package/example-bundle.json" --pubkey "$key"
            cp "$archive" "$RUNNER_TEMP/publish/verifier.tgz"
            printf 'verifier_hash=%s\n' "$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            printf 'verifier_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          fi
          node --version > "$RUNNER_TEMP/publish/toolchain.txt"
          npm --version >> "$RUNNER_TEMP/publish/toolchain.txt"
          python -m pip freeze >> "$RUNNER_TEMP/publish/toolchain.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ github.sha }}
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: qualify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # No checkout, application code, build, tests or lifecycle scripts in this job.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: publication-${{ github.sha }}
          path: ${{ runner.temp }}/publish
      - name: Publish checked bytes and verify direct registry readback
        env:
          SERVER: ${{ inputs.publish_server }}
          VERIFIER: ${{ inputs.publish_verifier }}
          SERVER_HASH: ${{ needs.qualify.outputs.server_hash }}
          SERVER_VERSION: ${{ needs.qualify.outputs.server_version }}
          VERIFIER_HASH: ${{ needs.qualify.outputs.verifier_hash }}
          VERIFIER_VERSION: ${{ needs.qualify.outputs.verifier_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish"
          case "$DIST_TAG" in rc|latest) ;; *) exit 1;; esac
          publish_one() {
            local file="$1" hash="$2" package="$3" version="$4"
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            test -f "$file" && test ! -L "$file"
            printf '%s  %s\n' "$hash" "$file" | sha256sum --check --strict
            # An existing immutable version is not overwritten or automatically republished.
            local metadata="https://registry.npmjs.org/@attested-intelligence%2F${package}/${version}"
            local before
            before=$(curl -sS -o before.json -w '%{http_code}' --max-time 20 "$metadata")
            test "$before" = 404 || { echo "Registry state $before: refusing duplicate or uncertain publication"; return 1; }
            npm publish "$file" --ignore-scripts --access public --tag "$DIST_TAG" --provenance
            for attempt in $(seq 1 36); do
              if curl -fsS --max-time 20 "$metadata" -o registry.json; then
                node -e 'const j=require("./registry.json");if(!j.dist?.attestations?.url)throw Error("Published without provenance");const u=new URL(j.dist.tarball);if(u.origin!=="https://registry.npmjs.org")throw Error("Unexpected archive host")'
                url=$(node -p 'require("./registry.json").dist.tarball')
                curl -fsS --max-time 30 "$url" -o registry.tgz
                printf '%s  registry.tgz\n' "$hash" | sha256sum --check --strict
                echo "Verified registry bytes and provenance metadata for $package@$version"
                return 0
              fi
              sleep 10
            done
            echo 'Registry readback unresolved. Inspect it before any retry; do not assume publication failed.'
            return 1
          }
          if [ "$SERVER" = true ]; then publish_one server.tgz "$SERVER_HASH" aga-mcp-server "$SERVER_VERSION"; fi
          if [ "$VERIFIER" = true ]; then publish_one verifier.tgz "$VERIFIER_HASH" aga-verify "$VERIFIER_VERSION"; fi
